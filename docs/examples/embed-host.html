<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Embed host test</title>
    <style>
      body {
        font:
          13px/1.4 system-ui,
          sans-serif;
        margin: 0;
        background: #1b1f2b;
        color: #e8e8ee;
      }
      header {
        padding: 10px 16px;
        border-bottom: 1px solid #333a4d;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 380px;
        height: calc(100vh - 44px);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      pre {
        margin: 0;
        padding: 10px;
        overflow: auto;
        font-size: 11px;
        border-left: 1px solid #333a4d;
      }
    </style>
  </head>
  <body>
    <header>Host page at <b id="origin"></b> framing the atlas</header>
    <main>
      <iframe id="wazo-anatomy" title="Wazo Anatomy" src="http://localhost:3000/?embed=1"></iframe>
      <pre id="log"></pre>
    </main>
    <script>
      var ATLAS = 'http://localhost:3000';
      var frame = document.getElementById('wazo-anatomy');
      var logEl = document.getElementById('log');
      window.__log = [];
      document.getElementById('origin').textContent = location.origin;

      function note(kind, data) {
        var line = { t: Math.round(performance.now()), kind: kind, data: data };
        window.__log.push(line);
        logEl.textContent += line.t + ' ' + kind + ' ' + JSON.stringify(data) + '\n';
      }

      function send(type, fields) {
        var msg = Object.assign({ protocol: 'wazo-anatomy', version: 1, type: type }, fields || {});
        note('send', msg);
        frame.contentWindow.postMessage(msg, ATLAS);
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== ATLAS || event.source !== frame.contentWindow) {
          note('ignored-foreign', { origin: event.origin });
          return;
        }
        var msg = event.data;
        if (!msg || msg.protocol !== 'wazo-anatomy' || msg.version !== 1) return;
        note('recv', msg);
      });

      // Scripted session: ping, then a command every 2.5 s.
      var steps = [
        function () {
          send('ping');
        },
        function () {
          send('select', { meshId: 'ta2-1360-r' });
        },
        function () {
          send('select', { meshId: 'ta2-DOES-NOT-EXIST' });
        },
        function () {
          send('isolate', { meshId: 'ta2-1360-l' });
        },
        function () {
          send('set-layers', { systems: ['skeletal', 'cardiovascular'] });
        },
        function () {
          send('reset');
        },
        function () {
          send('set-layers', { systems: [] });
        },
        function () {
          send('select', { meshId: null });
        },
        function () {
          note('done', {});
        },
      ];
      var i = 0;
      setTimeout(function run() {
        if (i < steps.length) {
          steps[i++]();
          setTimeout(run, 2500);
        }
      }, 6000);
    </script>
  </body>
</html>
