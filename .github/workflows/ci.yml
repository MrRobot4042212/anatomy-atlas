name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
      # The viewer only needs these at build time; both fall back to local defaults.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_ASSETS_URL: /models
      # Prisma validates the URL shape at generate time; nothing connects in CI
      # (API e2e tests replace PrismaService with an in-memory fake).
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas?schema=public
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm build
