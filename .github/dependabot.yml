version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR per family keeps the lockfile churn reviewable.
      nextjs:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
      three:
        patterns: ['three', '@types/three', '@react-three/*', 'three-mesh-bvh']
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      tooling:
        patterns:
          [
            'turbo',
            'prettier',
            'husky',
            'lint-staged',
            'typescript',
            'vitest',
            '@vitest/*',
            'oxlint',
            'tsup',
            'tsx',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
